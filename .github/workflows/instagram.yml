name: Update Instagram Feed

on:
  schedule:
    - cron: "0 */6 * * *"   # každých 6 hodin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Instagram Profile + Feed (with fallback)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: "17841477970120373"
        run: |
          set -euo pipefail

          echo "Fetching profile..."
          curl --http1.1 -fLsS --retry 3 --retry-delay 5 \
            "https://graph.facebook.com/v25.0/${IG_ID}?fields=id,username,profile_picture_url,followers_count,follows_count,media_count&access_token=${IG_TOKEN}" \
            -o profile.json

          echo "Fetching feed with like_count + comments_count..."
          if ! curl --http1.1 -fLsS --retry 3 --retry-delay 5 \
            "https://graph.facebook.com/v25.0/${IG_ID}/media?fields=id,caption,media_type,media_url,permalink,thumbnail_url,timestamp,like_count,comments_count&limit=50&access_token=${IG_TOKEN}" \
            -o feed.json; then
            echo "Primary feed request failed, trying fallback..."
            curl --http1.1 -fLsS --retry 3 --retry-delay 5 \
              "https://graph.facebook.com/v25.0/${IG_ID}/media?fields=id,caption,media_type,media_url,permalink,thumbnail_url,timestamp&limit=50&access_token=${IG_TOKEN}" \
              -o feed.json
          fi

          echo "Profile response:"
          cat profile.json
          echo
          echo "Feed response:"
          cat feed.json
          echo

          node <<'EOF'
          const fs = require("fs");

          function readJson(path) {
            try {
              return JSON.parse(fs.readFileSync(path, "utf8"));
            } catch (e) {
              console.error(`Invalid JSON in ${path}`);
              throw e;
            }
          }

          const profile = readJson("profile.json");
          const feed = readJson("feed.json");

          if (profile.error) {
            console.error("Profile error:", JSON.stringify(profile.error, null, 2));
            process.exit(1);
          }

          if (feed.error) {
            console.error("Feed error:", JSON.stringify(feed.error, null, 2));
            process.exit(1);
          }

          const items = (feed.data || []).map(x => ({
            id: x.id,
            caption: x.caption || "",
            media_type: x.media_type,
            media_url: x.media_url || "",
            thumbnail_url: x.thumbnail_url || "",
            permalink: x.permalink || "",
            timestamp: x.timestamp || "",
            like_count: typeof x.like_count === "number" ? x.like_count : null,
            comments_count: typeof x.comments_count === "number" ? x.comments_count : null
          }));

          const out = {
            updated_at: new Date().toISOString(),
            profile: {
              id: profile.id,
              username: profile.username,
              profile_picture_url: profile.profile_picture_url || "",
              posts: profile.media_count ?? null,
              followers: profile.followers_count ?? null,
              following: profile.follows_count ?? null
            },
            items
          };

          fs.writeFileSync("data.json", JSON.stringify(out, null, 2));
          console.log("Wrote data.json:", { items: items.length });
          EOF

      - name: Commit changes
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update Instagram feed"
          git push
